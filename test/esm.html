<!DOCTYPE html>
<html lang="zh-CN" data-demo-status="pending">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xqtime esm 测试（ESM）</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231a7f37'/%3E%3Cpath d='M4 6l4 4 4-4' stroke='%23fff' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="demo.css">
</head>

<body>
    <div class="wrap">
        <h1>xqtime esm 测试</h1>
        <p class="subtitle">加载 <code>../lib/xqtime-esm.mjs</code>（ES Module，验证 default 与命名导出）</p>

        <p id="status" class="status" data-status="pending">PENDING · 运行中…</p>

        <ul id="checks" class="checks"></ul>

        <h2>输出演示</h2>
        <table>
            <thead>
                <tr>
                    <th>相对当前时间</th>
                    <th>friend(t)</th>
                    <th>friend(t, true)</th>
                </tr>
            </thead>
            <tbody id="demo-body"></tbody>
        </table>
        <p>
            <button id="recompute" type="button">重新计算</button>
        </p>

        <p class="nav">
            <a href="index.html">返回索引</a>
            <a href="browser.html">UMD 测试</a>
            <a href="amd.html">AMD 测试</a>
        </p>
    </div>

    <script src="demo-runner.js"></script>
    <script type="module">
        import xqtime, { friend } from '../lib/xqtime-esm.mjs';

        // 命名导出必须与 default 导出的 friend 是同一个函数
        if (friend !== xqtime.friend) {
            window.xqtimeDemoRun('ESM', null);
        } else {
            window.xqtimeDemoRun('ESM', friend);
        }
        window.xqtimeDemoRender(xqtime.friend);
    </script>
</body>

</html>
